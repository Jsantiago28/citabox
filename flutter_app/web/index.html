<!DOCTYPE html>
<html lang="es">
<head>
  <!--
    Al compilar, Flutter pone aquí el valor de --base-href (por defecto
    "/"). Debe empezar y terminar con "/".
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>Barbería PRO — Agenda y reservas para tu barbería</title>
  <meta name="description" content="Reserva tu cita en línea o gestiona tu barbería: agenda, clientes, barberos y reportes en un solo lugar.">
  <meta name="application-name" content="Barbería PRO">
  <meta name="theme-color" content="#141414">
  <meta name="color-scheme" content="light">

  <!-- Vista previa al compartir el enlace (WhatsApp, Facebook, Telegram...) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Barbería PRO">
  <meta property="og:locale" content="es_DO">
  <meta property="og:title" content="Barbería PRO — Reserva tu cita">
  <meta property="og:description" content="Escoge tu servicio, tu barbero y la hora que te convenga. Agenda, clientes y reservas en línea para barberías.">
  <meta property="og:image" content="icons/Icon-512.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">
  <meta property="og:image:alt" content="Logo de Barbería PRO">

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Barbería PRO — Reserva tu cita">
  <meta name="twitter:description" content="Escoge tu servicio, tu barbero y la hora que te convenga.">
  <meta name="twitter:image" content="icons/Icon-512.png">

  <!-- Instalación como app (Android / iOS) -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Barbería PRO">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #F4F4F2; }
  </style>
</head>
<body>
  <noscript>Barbería PRO necesita JavaScript activado para funcionar.</noscript>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
