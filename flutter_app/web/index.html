<!DOCTYPE html>
<html lang="es">
<head>
  <!--
    Al compilar, Flutter pone aquí el valor de --base-href (por defecto
    "/"). Debe empezar y terminar con "/".
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>Citabox — Agenda y reservas para tu negocio</title>
  <meta name="description" content="Reserva tu cita en línea o gestiona tu negocio: agenda, clientes, equipo y reportes en un solo lugar.">
  <meta name="application-name" content="Citabox">
  <meta name="theme-color" content="#141414">
  <meta name="color-scheme" content="light">

  <!-- Vista previa al compartir el enlace (WhatsApp, Facebook, Telegram...) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Citabox">
  <meta property="og:locale" content="es_DO">
  <meta property="og:title" content="Citabox: tus clientes reservan solos, las 24 horas">
  <meta property="og:description" content="Deja de contestar mensajes para dar citas. Comparte tu enlace y tu agenda se llena sola: clientes, equipo, recordatorios por WhatsApp y reportes. Prueba gratis 30 días.">
  <meta property="og:image" content="icons/Icon-512.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">
  <meta property="og:image:alt" content="Logo de Citabox">

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Citabox: tus clientes reservan solos, las 24 horas">
  <meta name="twitter:description" content="Comparte tu enlace y tu agenda se llena sola. Prueba gratis 30 días.">
  <meta name="twitter:image" content="icons/Icon-512.png">

  <!-- Instalación como app (Android / iOS) -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Citabox">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <link rel="manifest" href="manifest.json">

  <!-- Instalar en la pantalla de inicio: Chrome, Edge y Brave avisan con
       "beforeinstallprompt" apenas carga la página, antes que la app; se
       guarda para que el botón "Instalar" de la app lo use después
       (utils/navegador/navegador_web.dart). iPhone no tiene este aviso. -->
  <script>
    window.citabox = { aviso: null };
    window.addEventListener("beforeinstallprompt", function (e) {
      e.preventDefault();
      window.citabox.aviso = e;
      window.dispatchEvent(new Event("citabox-instalacion"));
    });
    window.addEventListener("appinstalled", function () {
      window.citabox.aviso = null;
      window.citabox.instalada = true;
      window.dispatchEvent(new Event("citabox-instalacion"));
    });
    window.citaboxInstalar = function () {
      var aviso = window.citabox.aviso;
      if (!aviso) return Promise.resolve("no-disponible");
      aviso.prompt();
      return aviso.userChoice.then(function (r) {
        window.citabox.aviso = null;
        return r.outcome;
      });
    };
  </script>

  <!-- Conectar antes con el motor gráfico de Flutter (gstatic) y con la base
       de datos: ahorra la espera de abrir la conexión en celulares lentos. -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://ncieqndyjqwkgxrbqcee.supabase.co" crossorigin>

  <style>
    html, body { margin: 0; height: 100%; background: #F4F4F2; }
    /* Pantalla de carga: se ve al instante mientras baja la app; la quita
       flutter_bootstrap.js cuando la app ya dibujó. */
    #cargando {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 18px;
      background: #141414; color: #E3C77E;
      font: 600 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      transition: opacity .3s ease;
    }
    #cargando.listo { opacity: 0; pointer-events: none; }
    #cargando .marca { font-size: 26px; font-weight: 800; color: #fff; letter-spacing: -.3px; }
    #cargando .marca span { color: #E3C77E; }
    #cargando .barra { width: 140px; height: 4px; border-radius: 4px; background: #2A2B2E; overflow: hidden; }
    #cargando .barra::after {
      content: ""; display: block; width: 40%; height: 100%;
      border-radius: 4px; background: #C9A24B;
      animation: cargar 1.1s ease-in-out infinite;
    }
    @keyframes cargar { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) { #cargando .barra::after { animation: none; width: 100%; } }
  </style>
</head>
<body>
  <div id="cargando" role="status" aria-label="Cargando Citabox">
    <svg width="72" height="72" viewBox="0 0 100 100" aria-hidden="true">
      <rect width="100" height="100" rx="22" fill="#141414"/>
      <rect x="34" y="18" width="7" height="16" rx="3.5" fill="#C9A24B"/>
      <rect x="59" y="18" width="7" height="16" rx="3.5" fill="#C9A24B"/>
      <rect x="21" y="27" width="58" height="53" rx="10" fill="none" stroke="#C9A24B" stroke-width="6"/>
      <line x1="21" y1="42" x2="79" y2="42" stroke="#C9A24B" stroke-width="6"/>
      <polyline points="37,60 46,69 63,52" fill="none" stroke="#E3C77E" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div class="marca">Cita<span>box</span></div>
    <div class="barra"></div>
  </div>
  <noscript>Citabox necesita JavaScript activado para funcionar.</noscript>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
