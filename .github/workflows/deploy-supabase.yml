name: Publicar Supabase (migraciones y funciones)

# Cuando el CI termina en verde en master (o a mano), aplica en el Supabase
# real las migraciones nuevas de supabase/migrations y despliega las Edge
# Functions. Si falta el secreto SUPABASE_ACCESS_TOKEN, no hace nada y
# termina en verde. Ver docs/PUBLICAR.md.

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]

permissions:
  contents: read

concurrency:
  group: deploy-supabase
  cancel-in-progress: false

env:
  PROJECT_REF: ncieqndyjqwkgxrbqcee

jobs:
  publicar:
    name: Migraciones y funciones
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Comprobar secreto
        id: revisar
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "listo=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Supabase omitido::Falta SUPABASE_ACCESS_TOKEN. Ver docs/PUBLICAR.md."
          else
            echo "listo=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.revisar.outputs.listo == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: supabase/setup-cli@v1
        if: steps.revisar.outputs.listo == 'true'
        with:
          version: 2.122.0

      - name: Enlazar proyecto
        if: steps.revisar.outputs.listo == 'true'
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Aplicar migraciones nuevas
        if: steps.revisar.outputs.listo == 'true'
        run: supabase db push --linked --yes

      - name: Desplegar Edge Functions
        if: steps.revisar.outputs.listo == 'true'
        run: |
          for dir in supabase/functions/*/; do
            nombre=$(basename "$dir")
            echo "== $nombre"
            supabase functions deploy "$nombre" --use-api --project-ref "$PROJECT_REF"
          done
