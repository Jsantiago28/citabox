name: Copia de seguridad de la base de datos

# Cada domingo (y a mano): vuelca la base de datos de Supabase, la cifra y la
# guarda como artefacto 90 días. Si faltan los secretos, termina en verde con
# aviso. Cómo configurarlo y restaurar: docs/RESPALDOS.md.

on:
  schedule:
    - cron: '17 6 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: respaldo-db
  cancel-in-progress: false

jobs:
  respaldo:
    name: Respaldar y cifrar
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      RESPALDO_CLAVE: ${{ secrets.RESPALDO_CLAVE }}
    steps:
      - id: revisar
        run: |
          if [ -z "$SUPABASE_DB_URL" ] || [ -z "$RESPALDO_CLAVE" ]; then
            echo "listo=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Respaldo omitido::Faltan los secretos SUPABASE_DB_URL y/o RESPALDO_CLAVE. Ver docs/RESPALDOS.md."
          else
            echo "listo=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Instalar cliente PostgreSQL 17
        if: steps.revisar.outputs.listo == 'true'
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      # Esquemas public y auth. De auth se excluyen los datos que son secretos
      # o sesiones (tokens, claves MFA, sesiones, flujos); se conservan los
      # usuarios para poder restaurar las cuentas.
      - name: Volcar y cifrar
        if: steps.revisar.outputs.listo == 'true'
        run: |
          set -euo pipefail
          umask 077
          fecha=$(date -u +%Y-%m-%d)
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" \
            --no-owner --no-privileges \
            --schema=public --schema=auth \
            --exclude-table-data='auth.refresh_tokens' \
            --exclude-table-data='auth.sessions' \
            --exclude-table-data='auth.mfa_*' \
            --exclude-table-data='auth.flow_state' \
            --exclude-table-data='auth.one_time_tokens' \
            --exclude-table-data='auth.audit_log_entries' \
            --exclude-table-data='auth.saml_*' \
            --exclude-table-data='auth.sso_*' \
            | gzip -9 > respaldo.sql.gz
          test -s respaldo.sql.gz
          printf '%s' "$RESPALDO_CLAVE" | gpg --batch --yes --pinentry-mode loopback \
            --passphrase-fd 0 --symmetric --cipher-algo AES256 \
            -o "respaldo-$fecha.sql.gz.gpg" respaldo.sql.gz
          rm -f respaldo.sql.gz
          ls -l respaldo-*.gpg

      - name: Guardar copia cifrada
        if: steps.revisar.outputs.listo == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: respaldo-db
          path: respaldo-*.sql.gz.gpg
          retention-days: 90
          if-no-files-found: error
