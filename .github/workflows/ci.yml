name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  base-de-datos:
    name: Migraciones y seguridad (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Imitación de Supabase
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/00_supabase_stub.sql
      - name: Aplicar migraciones en orden
        run: |
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo "== $f"
            psql -v ON_ERROR_STOP=1 -q -f "$f"
          done
      - name: Pruebas de seguridad y agenda
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/10_seguridad_y_agenda.sql

  flutter:
    name: Flutter (análisis y pruebas)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  react:
    name: React de referencia (lint y build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
