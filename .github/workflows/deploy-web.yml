name: Publicar web (Cloudflare Pages)

# Se ejecuta a mano (Actions → "Publicar web" → Run workflow) y cuando el CI
# termina en verde en master. Si faltan los secretos, no publica y termina en
# verde: así no rompe nada mientras la publicación no esté configurada. Ver docs/PUBLICAR.md.

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  comprobar:
    name: Comprobar secretos
    runs-on: ubuntu-latest
    outputs:
      listo: ${{ steps.revisar.outputs.listo }}
    steps:
      - id: revisar
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          faltan=""
          for nombre in SUPABASE_URL SUPABASE_PUBLISHABLE_KEY CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!nombre}" ]; then faltan="$faltan $nombre"; fi
          done
          if [ -n "$faltan" ]; then
            echo "listo=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Publicación omitida::Faltan secretos:$faltan. Ver docs/PUBLICAR.md."
          else
            echo "listo=true" >> "$GITHUB_OUTPUT"
          fi

  publicar:
    name: Compilar y publicar
    needs: comprobar
    if: >-
      needs.comprobar.outputs.listo == 'true' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment:
      name: produccion
      url: ${{ steps.desplegar.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true

      # Quita espacios y saltos de línea que se cuelan al pegar los secretos.
      - name: Limpiar secretos
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          limpiar() { printf '%s' "$1" | tr -d '[:space:]'; }
          for par in SB_URL:SUPABASE_URL SB_KEY:SUPABASE_PUBLISHABLE_KEY \
                     CF_TOKEN:CLOUDFLARE_API_TOKEN CF_ACCOUNT:CLOUDFLARE_ACCOUNT_ID; do
            secreto=${par#*:}
            valor=$(limpiar "${!secreto}")
            echo "::add-mask::$valor"
            echo "${par%%:*}=$valor" >> "$GITHUB_ENV"
          done

      - name: Dependencias
        working-directory: flutter_app
        run: flutter pub get

      - name: Compilar versión web
        working-directory: flutter_app
        run: >-
          flutter build web --release
          --dart-define=SUPABASE_URL="$SB_URL"
          --dart-define=SUPABASE_PUBLISHABLE_KEY="$SB_KEY"

      # Flutter recorta las fuentes de íconos a los íconos usados pero no
      # cambia su nombre: con un hash en el nombre, cada versión obliga al
      # navegador a descargar la fuente nueva.
      - name: Versionar fuentes
        working-directory: flutter_app/build/web/assets
        run: |
          for fuente in fonts/*.otf packages/*/fonts/*.ttf; do
            [ -f "$fuente" ] || continue
            hash=$(sha256sum "$fuente" | cut -c1-10)
            nuevo="${fuente%.*}.$hash.${fuente##*.}"
            mv "$fuente" "$nuevo"
            sed -i "s#\"$fuente\"#\"$nuevo\"#g" FontManifest.json
            echo "$fuente -> $nuevo"
          done

      # Opcional: con la variable SITE_URL (p. ej. https://reservas.mibarberia.com)
      # la imagen de vista previa de WhatsApp usa una dirección completa.
      - name: Dirección completa para la vista previa
        if: vars.SITE_URL != ''
        working-directory: flutter_app/build/web
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          base="${SITE_URL%/}"
          sed -i \
            -e "s#content=\"icons/Icon-512.png\"#content=\"$base/icons/Icon-512.png\"#g" \
            -e "s#<meta property=\"og:type\" content=\"website\">#<meta property=\"og:type\" content=\"website\">\n  <meta property=\"og:url\" content=\"$base/\">#" \
            index.html

      # Crea el proyecto "barberia-pro" la primera vez (rama de producción:
      # master). Si ya existe, no hace nada.
      - name: Crear proyecto de Pages si no existe
        run: |
          echo "Largo de CLOUDFLARE_ACCOUNT_ID: ${#CF_ACCOUNT} (debe ser 32). Largo del token: ${#CF_TOKEN}."
          api="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects"
          codigo=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $CF_TOKEN" "$api/barberia-pro")
          if [ "$codigo" = "200" ]; then
            echo "El proyecto barberia-pro ya existe."
          elif [ "$codigo" = "404" ]; then
            curl -sf -X POST "$api" \
              -H "Authorization: Bearer $CF_TOKEN" \
              -H "Content-Type: application/json" \
              --data '{"name":"barberia-pro","production_branch":"master"}' > /dev/null
            echo "Proyecto barberia-pro creado."
          else
            echo "::error::Cloudflare respondió $codigo. Revisa CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi

      # La función flutter_app/functions/r/[slug].js (vista previa al compartir
      # el enlace) lee estas dos variables como secretos del proyecto Pages.
      # Se fijan antes de publicar para que la nueva versión ya las tenga.
      - name: Variables de la función de vista previa
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT }}
        run: |
          printf '%s' "$SB_URL" | npx --yes wrangler@3 pages secret put SUPABASE_URL --project-name=barberia-pro
          printf '%s' "$SB_KEY" | npx --yes wrangler@3 pages secret put SUPABASE_PUBLISHABLE_KEY --project-name=barberia-pro

      # workingDirectory: flutter_app → Pages toma ./functions de ahí.
      - name: Publicar en Cloudflare Pages
        id: desplegar
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CF_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT }}
          workingDirectory: flutter_app
          command: pages deploy build/web --project-name=barberia-pro --branch=master --commit-dirty=true
